<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Score Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-gray-100 min-h-screen flex justify-center items-center">
    <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md">
      <h1 class="text-3xl font-bold text-center mb-6 text-blue-600">
        Student Score Tracker
      </h1>

      <ul id="studentList" class="space-y-3"></ul>

      <button
        id="changeBtn"
        class="w-full bg-blue-500 text-white py-2 rounded-lg mt-4 hover:bg-blue-600 transition"
      >
        Show Passed Students Only
      </button>

      <p id="summary" class="mt-4 text-center font-semibold text-gray-700"></p>

      <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
        class="w-full p-2 border rounded-lg mb-2"
      />

      <input
        type="number"
        id="studentScore"
        placeholder="Enter student score"
        class="w-full p-2 border rounded-lg mb-2"
      />

      <p id="error" class="text-red-500 text-sm mb-2"></p>

      <button
        id="addStudentBtn"
        class="w-full bg-blue-500 text-white py-2 rounded-lg mb-4"
      >
        Add Student
      </button>

      <input
        type="text"
        id="search"
        placeholder="Search for students"
        class="w-full p-2 border rounded-lg mb-2"
      />
      <button
        id="searchBtn"
        class="w-full bg-blue-500 text-white py-2 rounded-lg mb-4"
      >
        Search Student
      </button>
    </div>

    <script>
      const students = [
        { name: "Daniel", score: 45 },
        { name: "Fawaz", score: 82 },
        { name: "Baqi", score: 60 },
        { name: "Clinton", score: 38 },
        { name: "David", score: 71 },
        { name: "Paul", score: 48 },
        { name: "Mubarak", score: 62 },
        { name: "Aashia", score: 90 },
        { name: "Quarid", score: 80 },
        { name: "Bobola", score: 95 },
      ];

      const studentList = document.getElementById("studentList");
      const summary = document.getElementById("summary");
      const changeBtn = document.getElementById("changeBtn");
      const studentName = document.getElementById("studentName");
      const studentScore = document.getElementById("studentScore");
      const error = document.getElementById("error");
      const addStudentBtn = document.getElementById("addStudentBtn");
      const search = document.getElementById("search");
      const searchBtn = document.getElementById("searchBtn");

      let showingPassed = false;
      let searchTerm = "";

      function displayStudents(list) {
        studentList.innerHTML = "";

        if (list.length === 0) {
          const li = document.createElement("li");
          li.textContent = "No students found.";
          li.classList.add("p-3", "text-center", "text-gray-500");
          studentList.appendChild(li);
          return;
        }

        list.forEach((student) => {
          const li = document.createElement("li");

          li.textContent = `${student.name} — ${student.score} points`;

          li.classList.add("p-3", "rounded-lg", "font-medium");

          if (student.score >= 50) {
            li.classList.add("bg-green-100", "text-green-700");
          } else {
            li.classList.add("bg-red-100", "text-red-700");
          }

          studentList.appendChild(li);
        });
      }

      function showSummary() {
        const passed = students.filter((student) => student.score >= 50);

        summary.textContent = `${passed.length} out of ${students.length} students passed`;
      }

      function render() {
        let list = students;

        if (showingPassed) {
          list = list.filter((student) => student.score >= 50);
        }

        if (searchTerm !== "") {
          list = list.filter((student) =>
            student.name.toLowerCase().includes(searchTerm),
          );
        }

        displayStudents(list);
        showSummary();
      }

      render();

      changeBtn.addEventListener("click", () => {
        showingPassed = !showingPassed;

        if (showingPassed) {
          changeBtn.textContent = "Show All Students";
          changeBtn.classList.remove("bg-blue-500", "hover:bg-blue-600");
          changeBtn.classList.add("bg-green-500", "hover:bg-green-600");
        } else {
          changeBtn.textContent = "Show Passed Students Only";
          changeBtn.classList.remove("bg-green-500", "hover:bg-green-600");
          changeBtn.classList.add("bg-blue-500", "hover:bg-blue-600");
        }

        render();
      });

      addStudentBtn.addEventListener("click", () => {
        const name = studentName.value.trim();
        const score = studentScore.value;

        if (name === "" || score === "") {
          error.textContent = "Please enter both a name and a score.";
          return;
        }

        if (Number(score) < 0 || Number(score) > 100) {
          error.textContent = "Score must be between 0 and 100.";
          return;
        }

        error.textContent = "";

        students.push({
          name: name,
          score: Number(score),
        });

        studentName.value = "";
        studentScore.value = "";

        render();
      });

      searchBtn.addEventListener("click", () => {
        searchTerm = search.value.trim().toLowerCase();
        render();
      });
    </script>
  </body>
</html>
